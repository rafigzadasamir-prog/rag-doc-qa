[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-doc-qa"
version = "0.1.0"
description = "A FastAPI Retrieval-Augmented Generation service for document question answering, with a deterministic offline extractive fallback mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samir Rafigzada", email = "rafigzadasamir@gmail.com" }]
keywords = ["rag", "retrieval-augmented-generation", "fastapi", "anthropic", "chromadb"]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3.0",
    "torch==2.8.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "pypdf>=4.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_doc_qa"]
